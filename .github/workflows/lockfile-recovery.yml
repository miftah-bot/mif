name: lockfile-recovery

on:
  workflow_dispatch:
  push:
    paths:
      - backend/package.json
      - backend/package-lock.json
      - .github/workflows/lockfile-recovery.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Generate candidate lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate candidate lockfile
        working-directory: backend
        run: node scripts/verify-dependency-contract.js
      - name: Verify clean install from candidate
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit candidate lockfile
        run: |
          if git diff --quiet -- backend/package-lock.json && git ls-files --error-unmatch backend/package-lock.json >/dev/null 2>&1; then
            echo "No lockfile change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore(v104): commit recovered backend lockfile"
          git pull --rebase origin main
          git push origin HEAD:main

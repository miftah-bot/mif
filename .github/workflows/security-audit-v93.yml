name: security-audit-v93

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/src/**'
      - 'backend/prisma/**'
      - 'backend/scripts/**'
      - 'SECURITY.md'
      - '.github/workflows/security-audit-v93.yml'
      - 'VERSION'

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/distributor_platform_security_v93
      INTEGRATION_DB_NAME: distributor_platform_security_v93
      V93_SBOM_REQUIRED: 'true'
      V93_AUDIT_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Require reviewed lockfile
        working-directory: backend
        run: test -f package-lock.json
      - name: Exact install
        working-directory: backend
        run: npm ci --ignore-scripts --no-fund
      - name: Static security gate
        working-directory: backend
        run: npm run security:static
      - name: Generate CycloneDX SBOM
        working-directory: backend
        run: mkdir -p .release && npm run security:sbom > .release/dependency-sbom-v93.cdx.json
      - name: Dependency audit
        working-directory: backend
        run: npm audit --json > .release/npm-audit-v93.json
      - name: Record audit evidence
        working-directory: backend
        run: npm run release:provenance:v93
      - name: Verify V93 provenance
        working-directory: backend
        run: npm run verify:provenance:v93
      - name: V93 security gate
        working-directory: backend
        run: npm run verify:v93
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v93-security-evidence-${{ github.sha }}
          path: backend/.release/**
          if-no-files-found: warn

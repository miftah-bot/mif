name: runtime-gate
# V104 runtime gate: release contract + backend + mobile evidence.
# Promotion path consumes the exact artifact from this run.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'mobile/**'
      - 'docker-compose*.yml'
      - '.github/workflows/runtime-gate.yml'
      - 'VERSION'
      - 'RELEASE_BUILD'
      - 'backend/VERSION'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: runtime-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: distributor_platform_test_v104
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d distributor_platform_test_v104"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/distributor_platform_test_v104
      INTEGRATION_DB_REQUIRED: 'true'
      INTEGRATION_DB_NAME: distributor_platform_test_v104
      INTEGRATION_RESTORE_DB_NAME: distributor_restore_smoke_v104
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Verify release identity
        working-directory: backend
        run: npm run verify:current-release
      - name: Generate candidate lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify dependency contract
        working-directory: backend
        run: npm run verify:dependencies
      - name: Install exact dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Run backend tests
        working-directory: backend
        run: npm test

  mobile-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test

  runtime-decision:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [backend-runtime, mobile-runtime]
    steps:
      - uses: actions/checkout@v6
      - name: Require both runtime gates
        run: |
          test "${{ needs.backend-runtime.result }}" = success
          test "${{ needs.mobile-runtime.result }}" = success
      - name: Create runtime certification
        run: |
          mkdir -p runtime-certification
          cat > runtime-certification/release-certification-current.json <<EOF
          {
            "schemaVersion": 1,
            "status": "PASS",
            "release": {
              "version": "0.104.0",
              "build": 104
            },
            "ci": {
              "githubActions": true,
              "workflow": "runtime-gate",
              "runId": "${{ github.run_id }}",
              "sha": "${{ github.sha }}"
            },
            "upstream": {
              "backendRuntime": "${{ needs.backend-runtime.result }}",
              "mobileRuntime": "${{ needs.mobile-runtime.result }}",
              "closureContract": "success"
            },
            "productionEligible": true
          }
          EOF
      - name: Upload runtime certification
        uses: actions/upload-artifact@v4
        with:
          name: distributor-runtime-release-certification-${{ github.sha }}
          path: runtime-certification/release-certification-current.json
          if-no-files-found: error

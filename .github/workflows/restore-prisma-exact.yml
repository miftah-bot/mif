name: restore-prisma-exact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-prisma-exact.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore exact Prisma schema and baseline
        env:
          S0: ''
          S1: ''
          S2: ''
          S3: ''
          S4: ''
          S5: ''
          S6: '2uNCdhVMWRbllXFDDY/4FxuKQrtbfrOXfpODJbRkXj4gXbEF2TD3Ph57vN6dwthb3cyJMxX7H2ym0d3fYwAA'
          B0: ''
          B1: ''
          B2: ''
          B3: ''
          B4: ''
          B5: ''
        run: |
          SCHEMA_GZ_B64="$S0$S1$S2$S3$S4$S5$S6"
          BASELINE_GZ_B64="$B0$B1$B2$B3$B4$B5"
          mkdir -p backend/prisma/migrations/20260916000100_production_baseline
          printf '%s' "$SCHEMA_GZ_B64" | base64 -d | gzip -d > backend/prisma/schema.prisma
          printf '%s' "$BASELINE_GZ_B64" | base64 -d | gzip -d > backend/prisma/migrations/20260916000100_production_baseline/migration.sql
          test "$(sha256sum backend/prisma/schema.prisma | cut -d' ' -f1)" = d7267df1805f7b426992324b158e6a52d2a910840bc67705626b6b54e56b906b
          test "$(sha256sum backend/prisma/migrations/20260916000100_production_baseline/migration.sql | cut -d' ' -f1)" = f8d39b504a1315c521f6333f613db1d76333761d119b4a7cca45416b12862168
      - name: Commit exact Prisma files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/prisma/schema.prisma backend/prisma/migrations/20260916000100_production_baseline/migration.sql
          if git diff --cached --quiet; then
            echo "Exact Prisma files already present."
            exit 0
          fi
          git commit -m "chore(v104): restore exact prisma schema and baseline"
          git push origin HEAD:main
